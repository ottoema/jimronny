<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jim Ronny 🃏</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f4f0ea'/><text y='.9em' font-size='90'>🃏</text></svg>">
  <meta name="apple-mobile-web-app-title" content="Jim Ronny">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="notification"></div>
<div id="app">
  <header>
    <h1>🃏 Jim Ronny</h1>
    <div id="easter-banner">🐣&thinsp;🥚&thinsp;🐰&thinsp;🌸&thinsp;🌷&thinsp;🥚&thinsp;🐰&thinsp;🌸&thinsp;🐣</div>
    <div id="auth-bar"></div>
  </header>

  <nav>
    <button id="nav-home" class="active" onclick="showView('home')">Hem</button>
    <button id="nav-game" disabled onclick="showView('game')">Match</button>
    <button id="nav-stats" onclick="showView('stats')">Statistik</button>
    <button id="nav-admin" onclick="showView('admin')" style="display:none">Admin</button>
  </nav>

  <div id="view-home" class="view active"></div>
  <div id="view-game" class="view"></div>
  <div id="view-stats" class="view"></div>
  <div id="view-admin" class="view"></div>
</div>

<div id="standings-backdrop" onclick="closeStandingsSheet()"></div>
<div id="standings-sheet"></div>
<div id="chart-backdrop" onclick="closeChartOverlay()"></div>
<div id="chart-overlay">
  <div style="padding:12px 0 4px;text-align:center">
    <div style="width:40px;height:4px;background:rgba(26,23,20,0.2);border-radius:2px;display:inline-block"></div>
  </div>
  <div style="padding:4px 24px 40px">
    <div id="chart-overlay-content"></div>
  </div>
</div>

<!-- Load order matters: each file depends on globals from prior files -->
<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/game.js"></script>
<script src="js/chart.js"></script>
<script src="js/render.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
