name: Provision Azure infrastructure

on:
  push:
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  contents: read

# One-time setup — create the service principal and store its JSON as AZURE_CREDENTIALS:
#
#   az group create --name jimronny-rg --location westeurope
#
#   az ad sp create-for-rbac \
#     --name jimronny-github-actions \
#     --role Contributor \
#     --scopes /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/jimronny-rg \
#     --json-auth
#
# Copy the full JSON output to a GitHub secret named AZURE_CREDENTIALS.
# Also add secrets: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET
# And a variable: ALLOWED_EMAILS
# After the first infra run, follow the job summary instructions to set
# AZURE_STATIC_WEB_APPS_API_TOKEN and AZURE_FUNCTION_APP_PUBLISH_PROFILE.

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        id: bicep
        run: |
          OUTPUT=$(az deployment group create \
            --resource-group jimronny-rg \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query "properties.outputs" -o json)
          echo "SWA_TOKEN=$(echo $OUTPUT | jq -r '.swaDeploymentToken.value')" >> $GITHUB_OUTPUT
          echo "SWA_HOST=$(echo $OUTPUT | jq -r '.swaHostname.value')" >> $GITHUB_OUTPUT
          echo "FUNC_HOST=$(echo $OUTPUT | jq -r '.funcAppHostname.value')" >> $GITHUB_OUTPUT

      - name: Print secrets for manual GitHub setup
        run: |
          echo "## Post-deployment setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run these locally to set required GitHub secrets:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "az staticwebapp secrets list --name jimronny --query 'properties.apiKey' -o tsv \\" >> $GITHUB_STEP_SUMMARY
          echo "  | gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN --repo ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "az functionapp deployment list-publishing-profiles \\" >> $GITHUB_STEP_SUMMARY
          echo "  --name jimronny-api --resource-group jimronny-rg --xml \\" >> $GITHUB_STEP_SUMMARY
          echo "  | gh secret set AZURE_FUNCTION_APP_PUBLISH_PROFILE --repo ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SWA hostname: ${{ steps.bicep.outputs.SWA_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "Function App hostname: ${{ steps.bicep.outputs.FUNC_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Also add \`https://${{ steps.bicep.outputs.FUNC_HOST }}/api/authCallback\` to Google OAuth authorized redirect URIs." >> $GITHUB_STEP_SUMMARY

      - name: Configure Function App settings
        run: |
          az functionapp config appsettings set --name jimronny-api \
            --resource-group jimronny-rg \
            --settings \
              GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
              ALLOWED_EMAILS="${{ vars.ALLOWED_EMAILS }}"
