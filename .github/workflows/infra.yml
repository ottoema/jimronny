name: Provision Azure infrastructure

on:
  push:
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC login
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC — no stored credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: bicep
        run: |
          OUTPUT=$(az deployment group create \
            --resource-group jimronny-rg \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query "properties.outputs" -o json)
          echo "SWA_TOKEN=$(echo $OUTPUT | jq -r '.swaDeploymentToken.value')" >> $GITHUB_OUTPUT
          echo "COSMOS_CONN=$(echo $OUTPUT | jq -r '.cosmosConnectionString.value')" >> $GITHUB_OUTPUT
          echo "SWA_HOST=$(echo $OUTPUT | jq -r '.swaHostname.value')" >> $GITHUB_OUTPUT

      - name: Write SWA token + Cosmos connection string to GitHub secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN --body "${{ steps.bicep.outputs.SWA_TOKEN }}" --repo ${{ github.repository }}
          gh secret set COSMOS_CONNECTION_STRING --body "${{ steps.bicep.outputs.COSMOS_CONN }}" --repo ${{ github.repository }}

      - name: Configure SWA app settings
        run: |
          az staticwebapp appsettings set --name jimronny \
            --setting-names \
              ALLOWED_EMAILS="${{ vars.ALLOWED_EMAILS }}" \
              GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
              COSMOS_CONNECTION_STRING="${{ steps.bicep.outputs.COSMOS_CONN }}"
